<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 102 102" width="256" height="256"
     role="img" aria-label="Dr. William Petrini">
  <title>Dr. William Petrini — timbro, monocromatico</title>
  <!--
    Variante a un colore, per gli usi in cui il magenta non c è: stampa
    in tinta unica, incisione, fondo colorato, misure minime. Tutto in
    currentColor — si imposta color sul contenitore e il segno intero
    ci si adegua.

    L anello resta più tenue del profilo anche qui: la gerarchia fra
    campo e figura è la stessa del timbro a colori, ed è quella che
    impedisce al cerchio di vincere sul volto.
  -->
